    <text x="66" y="52" font-size="10" fill="#bdcbe2">Inventory &amp; Sales</text>
    <text x="35" y="143" font-size="14" fill="#dbe5f7">○　Products</text><rect x="15" y="169" width="190" height="38" rx="9" fill="#294d9f"/><text x="35" y="191" font-size="14" fill="#ffffff">●　New Sale</text><text x="35" y="239" font-size="14" fill="#dbe5f7">○　Alerts</text><text x="35" y="287" font-size="14" fill="#dbe5f7">○　Sales</text>
    <path d="M18 330H202" stroke="#30415f"/>
