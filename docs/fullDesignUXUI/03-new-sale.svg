    <circle cx="1190" cy="39" r="18" fill="#e2ebff"/><text x="1190" y="44" text-anchor="middle" font-size="14" fill="#3867ed">H</text>
    <text x="1215" y="35" font-size="12" font-weight="700">Owner</text><text x="1215" y="49" class="muted tiny">Account</text>
    <text x="250" y="108" class="title">New Sale</text>
    <text x="250" y="133" class="muted body">Manage your store with a clear, simple workflow.</text>
    
<rect x="250" y="160" width="620" height="560" rx="13" class="card"/>
<text x="276" y="195" class="section">Add products to sale</text><text x="276" y="219" class="muted small">Search and add available products to the cart.</text>
