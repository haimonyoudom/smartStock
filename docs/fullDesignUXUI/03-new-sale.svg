<rect x="916" y="572" width="308" height="50" rx="9" class="btn"/><text x="1070" y="603" text-anchor="middle" class="btntext">Complete Sale</text><text x="1070" y="648" text-anchor="middle" class="muted small">Stock updates after successful checkout.</text>

    </svg>