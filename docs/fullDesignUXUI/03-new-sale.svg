<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
<defs>
 <style>
  text{font-family:Inter,Arial,sans-serif;fill:#172b4d}
  .muted{fill:#73839f}.tiny{font-size:11px}.small{font-size:12px}.body{font-size:14px}
  .title{font-size:24px;font-weight:700}.section{font-size:16px;font-weight:700}
  .card{fill:#fff;stroke:#e6ecf5;stroke-width:1}.btn{fill:#3867ed}.btntext{fill:#fff;font-size:13px;font-weight:700}
  .line{stroke:#edf1f7;stroke-width:1}.pill{font-size:11px;font-weight:700}
 </style>
</defs>

    <rect width="1280" height="800" fill="#f6f8fc"/>
    <rect width="220" height="800" fill="#102344"/>
