  .title{font-size:24px;font-weight:700}.section{font-size:16px;font-weight:700}
  .card{fill:#fff;stroke:#e6ecf5;stroke-width:1}.btn{fill:#3867ed}.btntext{fill:#fff;font-size:13px;font-weight:700}
